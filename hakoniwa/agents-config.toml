# constants
{% set home = os_env("HOME") %}
{% set pwd  = os_env("PWD")  %}

# unshare linux namespace
namespaces = [
  { type = "cgroup"     },  # --unshare-cgroup
  { type = "ipc"        },  # --unshare-ipc
  # { type = "network"    },  # --unshare-network
  { type = "uts"        },  # --unshare-uts
]

# environment
[[envs]]
name = "LANG"
[[envs]]
name = "LANGUAGE"
[[envs]]
name = "TERM"
[[envs]]
name = "HOME"
[[envs]]
name = "PATH"
[[envs]]
name = "EDITOR"
name = "BROWSER"
name = "TERMINAL"


# mount filesystem
[[mounts]]
source = "/bin"   # --bindmount-ro /bin
[[mounts]]
source = "/etc"   # --bindmount-ro /etc
[[mounts]]
source = "/lib"   # --bindmount-ro /lib
[[mounts]]
source = "/lib64"  # --bindmount-ro /lib64
[[mounts]]
source = "/sbin"  # --bindmount-ro /sbin
[[mounts]]
source = "/usr"  # --bindmount-ro /usr
[[mounts]]
source = ""
destination = "/dev"
type = "devfs"   # --devfs /dev
[[mounts]]
source = ""
destination = "/tmp"
type = "tmpfs"   # --tmpfs /tmp
[[mounts]]
source = ""
destination = "/run"
type = "tmpfs"   # --tmpfs /run
[[mounts]]
source = "{{ home }}"
destination = "{{ home }}"    # --bindmount-ro $HOME
[[mounts]]
source = "{{ pwd }}"
destination = "{{ pwd }}"
rw = true    # --bindmount-rw $PWD
# ssh refuses Included configs not owned by root/user; inside the userns
# root-owned files appear as nobody, so hide the drop-in dir
[[mounts]]
source = ""
destination = "/etc/ssh/ssh_config.d"
type = "tmpfs"

[[mounts]]
source = "{{ home }}/.omp"
destination = "{{ home }}/.omp"
rw = true

[[mounts]]
source = "/run/systemd/resolve/"
destination = "/run/systemd/resolve/"


